
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Cursos</title>

    <link rel="stylesheet" href="./css/cursos.css">
</head>

<body>

    <main class="contenedor">

        <h1>Gestión de Cursos</h1>


        <!-- =====================================================
             FORMULARIO DE REGISTRO / EDICIÓN
        ====================================================== -->

        <section class="formulario">

            <h2 id="tituloFormulario">
                Registrar Curso
            </h2>

            <form id="cursoForm">

                <div class="campo">

                    <label for="nivel">
                        Nivel
                    </label>

                    <input
                        type="number"
                        id="nivel"
                        name="nivel"
                        min="1"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="division">
                        División
                    </label>

                    <input
                        type="text"
                        id="division"
                        name="division"
                        maxlength="1"
                        placeholder="A"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="btnGuardar"
                >
                    Registrar Curso
                </button>


                <button
                    type="button"
                    id="btnCancelar"
                    class="btn-cancelar"
                    hidden
                >
                    Cancelar edición
                </button>

            </form>


            <p id="mensaje"></p>

        </section>



        <!-- =====================================================
             LISTADO DE CURSOS
        ====================================================== -->

        <section class="listado">

            <h2>
                Cursos registrados
            </h2>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Nivel</th>

                        <th>División</th>

                        <th>Estado</th>

                        <th>Acciones</th>

                    </tr>

                </thead>


                <tbody id="tablaCursos">

                    <!--
                        Los cursos se cargan dinámicamente
                        desde cursos.js
                    -->

                </tbody>

            </table>

        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="./js/cursos.js"
    ></script>

</body>

</html>
