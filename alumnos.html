<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alumnos - Mi Escuela Digital</title>

    <link rel="stylesheet" href="css/alumnos.css">
</head>

<body>

    <!-- =========================
         BARRA SUPERIOR
    ========================== -->

    <header class="topbar">

        <div>
            <h1>🏫 Mi Escuela Digital</h1>
        </div>

        <div class="usuario-info">

            <span id="nombreUsuario">
                Usuario
            </span>

            <span id="rolUsuario">
                Rol
            </span>

            <button id="btnCerrarSesion">
                Cerrar sesión
            </button>

        </div>

    </header>


    <!-- =========================
         CONTENIDO
    ========================== -->

    <main class="contenedor">

        <div class="encabezado">

            <div>

                <h2>👨‍🎓 Gestión de Alumnos</h2>

                <p>
                    Administración de alumnos de la institución
                </p>

            </div>


            <div class="acciones">

                <button
                    id="btnVolver"
                    class="btn-secundario">

                    ← Volver al Dashboard

                </button>


                <button
                    id="btnNuevoAlumno"
                    class="btn-principal">

                    + Nuevo Alumno

                </button>

            </div>

        </div>


        <!-- =========================
             BUSCADOR
        ========================== -->

        <section class="busqueda">

            <label for="buscarAlumno">
                Buscar alumno
            </label>

            <input
                type="text"
                id="buscarAlumno"
                placeholder="Buscar por apellido, nombre, legajo o DNI..."
            >

        </section>


        <!-- =========================
             TABLA
        ========================== -->

        <section class="tabla-container">

            <table>

                <thead>

                    <tr>

                        <th>Legajo</th>

                        <th>Apellido</th>

                        <th>Nombre</th>

                        <th>DNI</th>

                        <th>Mail</th>

                        <th>Estado</th>

                        <th>Acciones</th>

                    </tr>

                </thead>


                <tbody id="tablaAlumnos">

                    <tr>

                        <td
                            colspan="7"
                            class="mensaje-tabla">

                            Cargando alumnos...

                        </td>

                    </tr>

                </tbody>

            </table>

        </section>


    </main>


    <!-- =========================
         MODAL NUEVO ALUMNO
    ========================== -->

    <div
        id="modalAlumno"
        class="modal oculto">

        <div class="modal-contenido">

            <div class="modal-header">

                <h2>Nuevo Alumno</h2>

                <button
                    id="btnCerrarModal"
                    class="btn-cerrar">

                    ×

                </button>

            </div>


            <form id="formAlumno">


                <div class="campo">

                    <label for="legajo">
                        Legajo
                    </label>

                    <input
                        type="text"
                        id="legajo"
                        name="legajo"
                        required>

                </div>


                <div class="campo">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required>

                </div>


                <div class="campo">

                    <label for="apellido">
                        Apellido
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        required>

                </div>


                <div class="campo">

                    <label for="documento">
                        DNI
                    </label>

                    <input
                        type="number"
                        id="documento"
                        name="documento"
                        required>

                </div>


                <div class="campo">

                    <label for="mail">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="mail"
                        name="mail">

                </div>


                <div class="campo">

                    <label for="fecha_nacimiento">
                        Fecha de nacimiento
                    </label>

                    <input
                        type="date"
                        id="fecha_nacimiento"
                        name="fecha_nacimiento">

                </div>


                <div class="modal-acciones">

                    <button
                        type="button"
                        id="btnCancelar"
                        class="btn-secundario">

                        Cancelar

                    </button>


                    <button
                        type="submit"
                        class="btn-principal">

                        Guardar alumno

                    </button>

                </div>

            </form>

        </div>

    </div>


    <script
        type="module"
        src="js/alumnos.js">
    </script>

</body>

</html>
